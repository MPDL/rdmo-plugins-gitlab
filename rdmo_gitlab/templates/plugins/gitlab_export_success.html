{% extends 'core/page.html' %}
{% load i18n %}
{% load core_tags %}

{% block page %}

    <h1>{% trans 'Successful Export to GitLab' %}</h1>

    <ul>
    {% for export in processed_exports %}
        <li>{{ export.label }}: {{ export.processing_status }}</li>
    {% endfor %}
    </ul>

    <a href="{{ repo_html_url }}">{% trans 'Go to GitLab repo' %}</a>

{% endblock %}
