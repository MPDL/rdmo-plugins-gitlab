{% extends 'core/page.html' %}
{% load i18n core_tags %}

{% block head %}
    {{ form.media }}
{% endblock %}

{% block page %}

    <h1>{% blocktrans %}Export to {{ source_title }} {% endblocktrans %}</h1>

    {% bootstrap_form submit=_('Export to GitLab') %}

    <style>
        .form-group.field-new_repo_name {
            display: {{ new_repo_name_display }};
        }

        .form-group.field-repo {
            display: {{ repo_display }};
        }
    </style>

{% endblock %}
